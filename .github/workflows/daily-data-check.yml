# Runs the daily data check: opens every gym's own page and confirms that the
# price and opening hours we show are still written there.
# Results go to the fact_checks table and show up on /admin/data.
#
# Needs one repository secret: DATABASE_URL (Settings → Secrets → Actions).
# GitHub only runs scheduled jobs from the main branch.
name: Daily data check

on:
  schedule:
    - cron: "0 3 * * *" # every day 03:00 UTC = 05:00 or 06:00 in Finland
  workflow_dispatch: # also lets you start it by hand from the Actions tab

concurrency:
  group: daily-data-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run db:verify
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
